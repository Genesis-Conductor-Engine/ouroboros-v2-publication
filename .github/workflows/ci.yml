name: ci

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
      - name: Run unit tests
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Rebuild deterministic benchmark outputs
        run: python -m ouroboros_v2_publication.benchmark --output-dir ci-results
      - name: Upload benchmark outputs
        uses: actions/upload-artifact@v4
        with:
          name: ouroboros-v2-results
          path: ci-results/
